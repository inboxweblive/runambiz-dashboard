<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- viewport-fit=cover is required for env(safe-area-inset-*)
       to report real values. Without it the insets are all 0 and
       content sits under the notch and home indicator. -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="robots" content="noindex, nofollow" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Runambiz">
<meta property="og:title" content="Runambiz — Your business now runs itself">
<meta property="og:description" content="A free website and an AI assistant that replies customers, takes orders and collects payment on WhatsApp and Telegram — while you sleep.">
<meta property="og:url" content="https://runambiz.com/">
<meta property="og:image" content="https://runambiz.com/og-cover.png">
<meta property="og:locale" content="en_NG">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Runambiz — Your business now runs itself">
<meta name="twitter:description" content="A free website and an AI assistant that replies customers, takes orders and collects payment on WhatsApp and Telegram — while you sleep.">
<meta name="twitter:image" content="https://runambiz.com/og-cover.png">


  <!-- Matches the app's dark shell, not the brand purple —
       theme-color paints the status bar area on Android. -->
  <meta name="theme-color" content="#090D16" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Runambiz" />

  <title>Dashboard — Runambiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/dashboard/main.jsx"></script>
</body>
</html>
